<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مِرسام — استوديو بوسترات لجنة المساجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="gfonts" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700;900&family=Changa:wght@400;600;700&family=Marhey:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   مِرسام / Mirsam — Arabic poster studio
   Chrome: dark warm-slate workbench. Two accents only —
   brass (selection / focus / primary) and green (transient feedback).
   The poster is the subject; the tool stays quiet. See DESIGN.md §9.
   ──────────────────────────────────────────────────────────────
   OFFLINE FONTS: drop .woff2 files into ./fonts/ and uncomment the
   @font-face block at the bottom of this stylesheet, then remove the
   <link id="gfonts"> above. Names must match the FONTS list in JS.
   ════════════════════════════════════════════════════════════════ */
:root{
  --bg:#121614;
  --bg2:#191f1d;
  --panel:#1d2422;
  --panel2:#242d2a;
  --line:#2f3b37;
  --line2:#3b4844;
  --txt:#e9e6dd;
  --txt2:#9ba8a2;
  --txt3:#6e7c76;
  --brass:#c8a44a;
  --brass2:#e2c375;
  --green:#37c39a;
  --danger:#d9705c;
  --r:9px;
  --ui:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--txt);font-family:var(--ui);
  font-size:13px;overflow:hidden;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2f3b37;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#3b4844}
::-webkit-scrollbar-track{background:transparent}

/* ── shell ─────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%}
#topbar{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;flex:0 0 52px;
  background:linear-gradient(180deg,#1c2321,#161c1a);
  border-bottom:1px solid var(--line);z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.2px;font-size:15px}
.brand .mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:conic-gradient(from 220deg,var(--brass),#0c4a2e 40%,#12395f 70%,var(--brass));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.brand small{display:block;font-weight:500;font-size:10px;color:var(--txt3);margin-top:-4px;letter-spacing:0}
.spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;
  transition:background .12s,border-color .12s,transform .08s;white-space:nowrap;
}
.btn:hover{background:#2c3733}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel2)}
.btn.pri{background:linear-gradient(180deg,#d3ae51,#b8912f);border-color:#8d6d1c;color:#20180a;font-weight:800}
.btn.pri:hover{background:linear-gradient(180deg,#e0bd63,#c69d38)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt2)}
.btn.ghost:hover{background:var(--panel2);color:var(--txt)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.icon{padding:6px;width:31px;height:31px;flex:0 0 31px}
.btn.wide{width:100%}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}

/* ── body columns ──────────────────────────────────── */
#main{flex:1;display:flex;min-height:0}
.pane{
  width:312px;flex:0 0 312px;background:var(--panel);
  border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#right{border-inline-end:none;border-inline-start:1px solid var(--line);width:298px;flex-basis:298px}
.pane-head{display:flex;gap:2px;padding:7px;border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--bg2)}
.tab{
  flex:1;text-align:center;padding:7px 4px;border-radius:7px;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--txt3);border:1px solid transparent;
}
.tab.on{background:var(--panel2);color:var(--txt);border-color:var(--line2)}
.pane-body{flex:1;overflow-y:auto;padding:13px;min-height:0}
.tabpane{display:none}
.tabpane.on{display:block}

/* stepper — five steps, never modal, jump freely */
#stepper{display:flex;padding:9px 6px 7px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;position:relative}
#stepper::before{content:"";position:absolute;top:23px;inset-inline:26px;height:1px;background:var(--line)}
.step{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;
  background:none;border:0;padding:0;position:relative;z-index:1;
}
.step i{
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;font-style:normal;
  font-size:11.5px;font-weight:800;background:var(--panel);border:1px solid var(--line2);
  color:var(--txt3);transition:.14s;font-variant-numeric:tabular-nums;
}
.step b{font-size:10.5px;font-weight:700;color:var(--txt3);transition:.14s;white-space:nowrap}
.step:hover i{border-color:var(--txt3)}
.step.on i{background:var(--brass);border-color:var(--brass);color:#20180a}
.step.on b{color:var(--txt)}
.step.done i{border-color:var(--brass);color:var(--brass2)}

.sec{margin-bottom:19px}
.sec:last-child{margin-bottom:4px}
.sec-t{
  font-size:10.5px;font-weight:800;letter-spacing:.5px;color:var(--txt3);
  margin:0 0 9px;display:flex;align-items:center;gap:7px;
}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-t .mini{font-weight:600;letter-spacing:0;color:var(--txt3);cursor:pointer;background:none;border:0;padding:0;font-size:10.5px;text-decoration:underline;text-underline-offset:2px}
.sec-t .mini:hover{color:var(--brass2)}

label.f{display:block;margin-bottom:10px}
label.f > span{display:block;font-size:11.5px;color:var(--txt2);margin-bottom:4px;font-weight:600;line-height:1.5}
label.f > span em{font-style:normal;color:var(--txt3);font-weight:500}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=tel],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;outline:none;transition:border-color .12s,box-shadow .12s;line-height:1.6;
}
input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(200,164,74,.15)}
textarea{resize:vertical;min-height:70px;line-height:1.7}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt3) 50%),linear-gradient(135deg,var(--txt3) 50%,transparent 50%);background-position:left 12px top 16px,left 7px top 16px;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:26px}
input[type=color]{width:100%;height:32px;padding:2px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--brass);background:transparent;height:20px}
input[type=file]{display:none}
.row{display:flex;gap:7px;align-items:flex-end}
.row > *{flex:1;min-width:0}
.row > .fix{flex:0 0 auto}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  padding:5px 10px;font-size:11.5px;cursor:pointer;color:var(--txt2);
  text-align:start;line-height:1.5;transition:.12s;
}
.chip:hover{border-color:var(--brass);color:var(--txt)}
.chip.long{border-radius:8px;width:100%}
.chip .x{color:var(--txt3);margin-inline-start:5px;font-weight:800}
.chip .x:hover{color:var(--danger)}

.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{
  border:1.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
  background:var(--bg2);transition:border-color .12s,transform .1s;position:relative;
}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.on{border-color:var(--brass);box-shadow:0 0 0 3px rgba(200,164,74,.18)}
.card svg{display:block;width:100%;height:auto}
.card .cap{
  font-size:10px;padding:5px 4px;text-align:center;color:var(--txt2);
  border-top:1px solid var(--line);background:var(--panel);font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card.on .cap{color:var(--txt)}
.card .t2{position:absolute;top:4px;inset-inline-end:4px;background:rgba(20,26,24,.8);color:var(--brass2);font-size:8.5px;font-weight:800;padding:1px 4px;border-radius:4px;letter-spacing:.3px}

.pal{display:flex;height:24px;border-radius:6px;overflow:hidden}
.pal i{flex:1}
.pal i.w{flex:1.7}

.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{
  flex:1;background:transparent;border:0;padding:6px 3px;border-radius:6px;cursor:pointer;
  color:var(--txt3);font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;
}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button:hover:not(.on){color:var(--txt2)}
.seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;cursor:pointer}
.switch span{font-size:12px;color:var(--txt2);font-weight:600}
.switch input{display:none}
.track{width:36px;height:20px;border-radius:20px;background:var(--line);position:relative;transition:background .15s;flex:0 0 36px}
.track::after{content:"";position:absolute;top:2.5px;inset-inline-end:2.5px;width:15px;height:15px;border-radius:50%;background:var(--txt3);transition:.15s}
.switch input:checked + .track{background:rgba(200,164,74,.4)}
.switch input:checked + .track::after{inset-inline-end:18.5px;background:var(--brass2)}

.swatches{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.swatch{
  width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line2);cursor:pointer;padding:0;
  background:transparent;flex:0 0 auto;transition:.12s;
}
.swatch:hover{transform:translateY(-1px)}
.swatch.on{box-shadow:0 0 0 2px var(--brass);border-color:var(--brass)}
.swatch.none{color:var(--txt3);font-size:13px;display:grid;place-items:center;background:var(--bg2)}
.swatches .cx{width:32px;height:26px;padding:1px;flex:0 0 32px;border-radius:7px}
.hint{font-size:11px;color:var(--txt3);line-height:1.7;margin:6px 0 0}
.hint.warn{color:#c9915e}
.empty{color:var(--txt3);font-size:12px;text-align:center;padding:32px 14px;line-height:1.9}
.num{font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;font-size:11px;color:var(--txt3);margin-top:-2px;margin-bottom:3px}

/* ── stage ─────────────────────────────────────────── */
#stagewrap{
  flex:1;min-width:45%;position:relative;overflow:auto;
  background:
    radial-gradient(1100px 700px at 50% 0%,#1c2422 0%,#121614 70%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.011) 0 2px,transparent 2px 6px);
  display:flex;align-items:flex-start;justify-content:center;padding:24px 20px 86px;
}
/* direction:ltr on the scaler is load-bearing — the stage is always 1080 CSS px
   and the scaler is 1080×zoom, so in an RTL document the over-wide stage would
   overflow to the LEFT and sit off-canvas. The poster itself stays RTL. */
#scaler{position:relative;transform-origin:top left;flex:0 0 auto;direction:ltr}
#stage{
  direction:rtl;position:relative;overflow:hidden;background:#fff;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);
}
#bglayer{position:absolute;inset:0;pointer-events:none}
#bglayer svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#ellayer{position:absolute;inset:0}
#safeguide{position:absolute;border:1px dashed rgba(55,195,154,.5);display:none;pointer-events:none;z-index:19}

.el{position:absolute;box-sizing:border-box;cursor:default}
.el.selectable{cursor:move}
.el.text{white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
.el.text[contenteditable=true]{cursor:text;outline:none}
.el .metarow{display:flex;align-items:center;gap:.55em}
.el .metarow .mi{flex:0 0 auto;display:flex;align-items:center}
.el .metarow .mi svg{width:1.28em;height:1.28em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.el .metarow .mt{flex:1;min-width:0}
.el .metasep{height:1px;background:currentColor;opacity:.26}
.el .vline{width:1px;align-self:stretch;background:currentColor;opacity:.3;margin:0 .1em}
.el img{width:100%;height:100%;display:block;object-fit:cover}
/* meta row styles — icon column + rule + dotted separators (poster 1) */
.el .mstack{display:flex;flex-direction:column}
.el .mrowx{display:flex;align-items:center;gap:.62em;padding:.34em 0}
.el .mrowx .mi{flex:0 0 auto;display:flex;align-items:center}
.el .mrowx .mi svg{width:1.34em;height:1.34em;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;display:block}
.el .mrowx .vl{width:1px;align-self:stretch;background:currentColor;opacity:.32;margin-inline-end:.12em}
.el .mrowx .mt{flex:1;min-width:0}
.el .msep{border-top:1.7px dotted currentColor;opacity:.42;margin-inline-start:3em;height:0}
.el .msep.solid{border-top-style:solid;border-top-width:1px;opacity:.22;margin-inline-start:0}
.el .mstack.boxed .mrowx{padding:.44em 0}
.el .minline{display:flex;align-items:center;justify-content:center;gap:.72em;flex-wrap:wrap}
.el .mcell{display:flex;align-items:center;gap:.42em}
.el .minline .vline{height:1.1em;align-self:center}
.el .qrph{
  width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.25em;background:rgba(0,0,0,.05);border:1.5px dashed currentColor;opacity:.6;
  font-size:11px;font-weight:700;text-align:center;line-height:1.3;
}
.el .qrph svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.el.qr{background:transparent}
.el.divider svg{width:100%;height:100%;display:block;overflow:visible}
.el.locked{cursor:default}
.el .imgwrap{width:100%;height:100%;overflow:hidden;position:relative}
.el .scrim{position:absolute;inset:0;pointer-events:none}
.el.qr{display:grid;place-items:center;background:#fff}
.el.qr canvas,.el.qr img{width:100%!important;height:100%!important;display:block}
.el.overflowing{outline:1.5px solid rgba(217,112,92,.75);outline-offset:2px}

/* --iz counter-scales chrome inside the zoomed stage so handles stay grabbable */
#stage{--iz:1}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:20}
#sel{position:absolute;border:calc(1.5px * var(--iz)) solid var(--brass);display:none;pointer-events:none}
#sel .h{
  position:absolute;width:calc(13px * var(--iz));height:calc(13px * var(--iz));background:#fff;
  border:calc(1.5px * var(--iz)) solid var(--brass);border-radius:calc(3px * var(--iz));pointer-events:auto;
}
#sel .h.e{left:calc(-7px * var(--iz));top:50%;margin-top:calc(-6.5px * var(--iz));cursor:ew-resize}
#sel .h.w{right:calc(-7px * var(--iz));top:50%;margin-top:calc(-6.5px * var(--iz));cursor:ew-resize}
#sel .h.n{top:calc(-7px * var(--iz));left:50%;margin-left:calc(-6.5px * var(--iz));cursor:ns-resize}
#sel .h.s{bottom:calc(-7px * var(--iz));left:50%;margin-left:calc(-6.5px * var(--iz));cursor:ns-resize}
#sel .h.ne{top:calc(-7px * var(--iz));right:calc(-7px * var(--iz));cursor:nesw-resize}
#sel .h.nw{top:calc(-7px * var(--iz));left:calc(-7px * var(--iz));cursor:nwse-resize}
#sel .h.se{bottom:calc(-7px * var(--iz));right:calc(-7px * var(--iz));cursor:nwse-resize}
#sel .h.sw{bottom:calc(-7px * var(--iz));left:calc(-7px * var(--iz));cursor:nesw-resize}
#sel.editing{border-style:dashed;border-color:var(--green)}
#sel.editing .h{display:none}
#sel.autoh .h.n,#sel.autoh .h.s{display:none}
#sel .tag{
  position:absolute;top:calc(-25px * var(--iz));inset-inline-start:0;background:var(--brass);color:#20180a;
  font-size:calc(11px * var(--iz));font-weight:800;padding:calc(2px * var(--iz)) calc(7px * var(--iz));
  border-radius:calc(5px * var(--iz));white-space:nowrap;line-height:1.5;
}
#sel.editing .tag{background:var(--green);color:#04231a}
.guide{position:absolute;background:var(--green);pointer-events:none;z-index:21}
.guide.v{width:calc(1px * var(--iz));top:0;bottom:0}
.guide.h{height:calc(1px * var(--iz));left:0;right:0}
#hoverbox{position:absolute;border:calc(1px * var(--iz)) dashed rgba(200,164,74,.55);display:none;pointer-events:none}
#safeguide{border-width:calc(1px * var(--iz))}

#floatbar{
  position:fixed;z-index:60;display:none;gap:2px;background:#0d1211;
  border:1px solid var(--line2);border-radius:9px;padding:4px;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}
#floatbar button{
  background:transparent;border:0;color:var(--txt2);cursor:pointer;border-radius:6px;
  padding:5px 8px;font-weight:800;font-size:12px;min-width:29px;
}
#floatbar button:hover{background:var(--panel2);color:var(--txt)}
#floatbar .divv{width:1px;background:var(--line);margin:3px 1px}
#floatbar input[type=color]{width:26px;height:24px;padding:1px;border-radius:5px;border:1px solid var(--line2)}

#zoombar{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:3px;background:rgba(13,18,17,.92);
  border:1px solid var(--line2);border-radius:22px;padding:4px 6px;z-index:30;
  backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#zoombar button{background:transparent;border:0;color:var(--txt2);cursor:pointer;padding:5px 9px;border-radius:16px;font-weight:700}
#zoombar button:hover{background:var(--panel2);color:var(--txt)}
#zoombar button.on{color:var(--brass2)}
#zoomval{font-size:11.5px;color:var(--txt2);min-width:42px;text-align:center;font-variant-numeric:tabular-nums}
#zoombar .divv{width:1px;background:var(--line2);align-self:stretch;margin:2px 3px}

/* ── modal / toast ─────────────────────────────────── */
#scrim{position:fixed;inset:0;background:rgba(6,9,8,.72);display:none;z-index:80;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
#scrim.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal h3{margin:0;padding:15px 17px;border-bottom:1px solid var(--line);font-size:14.5px;flex:0 0 auto}
.modal .mb{padding:17px;overflow:auto}
.modal .mf{padding:11px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex:0 0 auto}
#toast{
  position:fixed;bottom:20px;inset-inline-start:20px;background:#0d1211;color:var(--txt);
  border:1px solid var(--line2);border-inline-start:3px solid var(--brass);
  padding:11px 15px;border-radius:10px;z-index:90;opacity:0;transform:translateY(10px);
  transition:.22s;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:340px;line-height:1.6;
}
#toast.on{opacity:1;transform:none}
#toast.bad{border-inline-start-color:var(--danger)}

.layerlist{display:flex;flex-direction:column;gap:3px}
.layeritem{
  display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;
  background:var(--bg2);border:1px solid transparent;font-size:12px;
}

/* ── tiny DOM helpers ─────────────────────────────────────────────── */
const $  = (s, r) => (r || document).querySelector(s);

   hairline · ink = the reading colour (navy demoted here, on purpose) ·

   Sampled from the four reference posters, then corrected. DESIGN.md §4.
   ─────────────────────────────────────────────────────────────────── */
const PAL = {
  gsc:      { name: 'نادي الجزيرة',  en: 'GSC',       deep: '#0C4A2E', alt: '#12395F', gold: '#B4862B', paper: '#F1E7DD', ink: '#16283C' },

  maroon:   { name: 'عنّابي',        en: 'Maroon',    deep: '#6B1F2A', alt: '#3A2320', gold: '#B08A3E', paper: '#F4EBE0', ink: '#2A1417' },
  teal:     { name: 'فيروزي',        en: 'Teal',      deep: '#0B4A52', alt: '#123A63', gold: '#B08C3C', paper: '#EEEAE0', ink: '#10262B' },
  charcoal: { name: 'فحمي',          en: 'Charcoal',  deep: '#22282B', alt: '#3E4A4E', gold: '#B08D42', paper: '#EFEBE3', ink: '#171B1D' },

};
const TOKENS = ['deep', 'alt', 'gold', 'paper', 'ink'];

/* resolve a stored colour token (or #hex escape hatch) to a real colour */
/* Backgrounds whose ground is dark by construction. Their text has to flip even
   when the `inverted` option is off, or `ink` paints black on black. */
const DARK_BG = { inverted: 1, 'duotone-photo': 1, upload: 1 };
function invActive() {
  if (typeof DOC === 'undefined' || !DOC) return false;
  const base = DARK_BG[DOC.bg] ? 1 : 0;
  const opt = (DOC.bgOpts && DOC.bgOpts.inverted) ? 1 : 0;
  return (base ^ opt) === 1;            /* the option TOGGLES, it doesn't set */

const groundColor = () => { const p = PAL[DOC.palette] || PAL.gsc; return invActive() ? p.deep : p.paper; };

/* `inverted` is a cross-cutting option, not one background (DESIGN.md C3), so
   the flip lives here and every element follows it for free.
   `use` matters: on a dark ground the same token has to resolve LIGHT when it
   paints type and stay DARK when it paints a panel behind type. Without that
   split, a "deep" heading disappears into a deep field. */
function C(tok, palId, use) {
  const p = PAL[palId || DOC.palette] || PAL.gsc;
  const inv = invActive();
  if (!tok) tok = 'ink';
  if (tok[0] === '#') return tok;
  if (inv) {
    if (use === 'text') {
      if (tok === 'gold') return mix(p.gold, '#ffffff', .28);
      return p.paper;                       /* ink · deep · alt · paper → the light one */
    }
    if (tok === 'paper') return p.paper;    /* still "the light one" as a fill */
    if (tok === 'ink')   return p.paper;
    if (tok === 'deep')  return mix(p.deep, p.paper, .16);
    if (tok === 'gold')  return mix(p.gold, '#ffffff', .22);
    if (tok === 'alt')   return mix(p.alt, p.paper, .42);
  }
  return p[tok] || p.ink;

/* mix towards another colour — used only for tints of a flat colour, never gradients */
function mix(a, b, t) {
  const h = s => [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16));

const SVGNS = 'xmlns="http://www.w3.org/2000/svg"';
const icoSvg = (k, extra) => ICONS[k] == null || k === 'none' ? '' : `<svg ${SVGNS} viewBox="0 0 24 24" ${extra || ''}>${ICONS[k]}</svg>`;

/* ── ornaments — every path constructed, no dingbats. DESIGN.md §7 ── */
const ORN = {
  /* hairline with a centre knot: separates */
  rule(g, i) {
    const y = 20, gap = 26;
    return `<path d="M4 ${y}H${150 - gap}M${150 + gap} ${y}H296" stroke="${g}" stroke-width="1.6" fill="none"/>
      <path d="M150 ${y - 9} 159 ${y} 150 ${y + 9} 141 ${y}z" fill="none" stroke="${g}" stroke-width="1.6"/>
      <circle cx="150" cy="${y}" r="2.4" fill="${g}"/>`;
  },
  /* 8-point girih strapwork band: separates and directs.
     Three units at a readable scale — a denser band turns into asterisks
     at poster size, which is exactly the clipart look we are replacing. */
  girih(g) {
    let p = '', s = 17.5, cx0 = 150, sp = s * 2.45;
    for (let k = -1; k <= 1; k++) {
      const cx = cx0 + k * sp, cy = 20;
      let d = '';
      for (let a = 0; a < 8; a++) {
        const t1 = (a / 8) * Math.PI * 2 - Math.PI / 8, t2 = ((a + 1) / 8) * Math.PI * 2 - Math.PI / 8;
        const x1 = cx + Math.cos(t1) * s, y1 = cy + Math.sin(t1) * s;
        const xm = cx + Math.cos((t1 + t2) / 2) * s * .43, ym = cy + Math.sin((t1 + t2) / 2) * s * .43;
        d += (a ? 'L' : 'M') + r2(x1) + ' ' + r2(y1) + 'L' + r2(xm) + ' ' + r2(ym);
      }
      p += `<path d="${d}Z" fill="none" stroke="${g}" stroke-width="1.7" stroke-linejoin="miter"/>`;
      /* straps tying the units together */
      if (k < 1) p += `<path d="M${r2(cx + s * .93)} 20H${r2(cx + sp - s * .93)}" stroke="${g}" stroke-width="1.7"/>`;
    }
    return `<path d="M4 20H${r2(cx0 - sp - s - 8)}M${r2(cx0 + sp + s + 8)} 20H296" stroke="${g}" stroke-width="1.4"/>` + p;
  },
  /* 16-fold compass rosette, hairline: anchors */
  rosette(g) {
    const cx = 150, cy = 20, R = 18; let d = '', d2 = '';
    for (let a = 0; a < 16; a++) {
      const t = (a / 16) * Math.PI * 2, t2 = ((a + .5) / 16) * Math.PI * 2;
      d += (a ? 'L' : 'M') + r2(cx + Math.cos(t) * R) + ' ' + r2(cy + Math.sin(t) * R)
         + 'L' + r2(cx + Math.cos(t2) * R * .56) + ' ' + r2(cy + Math.sin(t2) * R * .56);
      if (a % 2 === 0) d2 += `M${r2(cx + Math.cos(t) * R * .3)} ${r2(cy + Math.sin(t) * R * .3)}L${r2(cx + Math.cos(t + Math.PI) * R * .3)} ${r2(cy + Math.sin(t + Math.PI) * R * .3)}`;
    }
    return `<path d="M4 20H${cx - R - 14}M${cx + R + 14} 20H296" stroke="${g}" stroke-width="1.4"/>
      <path d="${d}Z" fill="none" stroke="${g}" stroke-width="1.3"/><path d="${d2}" stroke="${g}" stroke-width="1"/>
      <circle cx="${cx}" cy="${cy}" r="${R * .3}" fill="none" stroke="${g}" stroke-width="1.2"/>`;
  },
  /* square-kufic bar: frames */
  kufic(g) {
    const u = 6, x0 = 150 - u * 15, y0 = 20 - u * 2.5;
    const grid = ['111011101110111011101110111011', '100010001000100010001000100010', '101110111011101110111011101110', '100000000000000000000000000010', '111011101110111011101110111011'];
    let p = '';
    grid.forEach((row, ry) => row.split('').forEach((c, rx) => { if (c === '1') p += `<rect x="${r2(x0 + rx * u)}" y="${r2(y0 + ry * u)}" width="${u}" height="${u}"/>`; }));
    return `<g fill="${g}">${p}</g>`;
  },
  /* muqarnas step profile: anchors */
  muqarnas(g) {
    let d = 'M4 30'; const steps = 5, w = 13, h = 5;
    for (let k = steps; k >= 1; k--) d += `L${r2(150 - k * w)} 30L${r2(150 - k * w)} ${r2(30 - (steps - k + 1) * h)}L${r2(150 - (k - 1) * w)} ${r2(30 - (steps - k + 1) * h)}`;
    for (let k = 1; k <= steps; k++) d += `L${r2(150 + (k - 1) * w)} ${r2(30 - (steps - k + 1) * h)}L${r2(150 + k * w)} ${r2(30 - (steps - k + 1) * h)}L${r2(150 + k * w)} 30`;
    d += 'L296 30';
    return `<path d="${d}" fill="none" stroke="${g}" stroke-width="1.6" stroke-linejoin="miter"/>`;
  },
  /* nested lozenges: separates */
  diamond(g) {
    const c = 150, y = 20; let p = '';
    [12, 7.5, 3].forEach((s, i) => { p += `<path d="M${c} ${y - s}L${c + s} ${y}L${c} ${y + s}L${c - s} ${y}Z" fill="${i === 2 ? g : 'none'}" stroke="${g}" stroke-width="1.4"/>`; });
    [-1, 1].forEach(sd => { p += `<path d="M${c + sd * 30} ${y - 5.5}L${c + sd * 39} ${y}L${c + sd * 30} ${y + 5.5}Z" fill="none" stroke="${g}" stroke-width="1.4"/>`; });
    return `<path d="M4 ${y}H${c - 46}M${c + 46} ${y}H296" stroke="${g}" stroke-width="1.4"/>` + p;
  }
};
const ORN_AR = { rule: 'خط ومِعقد', girih: 'گِره', rosette: 'وردة', kufic: 'كوفي مربع', muqarnas: 'مقرنص', diamond: 'معيّنات' };
const ornSvg = (id, color) => `<svg ${SVGNS} viewBox="0 0 300 40" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;overflow:visible">${(ORN[id] || ORN.rule)(color)}</svg>`;

/* ═══════════════════════════════════════════════════════════════════
   BACKGROUNDS — parametric SVG, never bitmaps.
   bg(id, palette, opts, W, H) → { svg, safe }
   `safe` is the rectangle (in %) that layouts are allowed to use. This
   is the mechanic that fixes the references' drifting margins. §6/§8.
   ═══════════════════════════════════════════════════════════════════ */
const DEF_SAFE = { x: MARGIN, y: MARGIN, w: 100 - 2 * MARGIN, h: 100 - 2 * MARGIN };
const DEF_OPTS = { scale: 'normal', placement: 'corner', intensity: 100, weight: 'regular', inverted: false };

function tones(P, o) {
  const inv = !!o.inverted;
  return {
    ground: inv ? P.deep : P.paper,
    fig:    inv ? P.paper : P.deep,
    soft:   inv ? mix(P.paper, P.deep, .72) : mix(P.deep, P.paper, .72),
    ink:    inv ? P.paper : P.ink,
    gold:   inv ? mix(P.gold, '#ffffff', .22) : P.gold,
    alt:    inv ? mix(P.alt, P.paper, .42) : P.alt,
    inv
  };
}
const SCF = o => ({ tight: .74, normal: 1, grand: 1.36 }[o.scale] || 1);
const WTF = o => ({ hairline: 1, regular: 2, solid: 3.6 }[o.weight] || 2);
const INF = o => (o.intensity == null ? 100 : o.intensity) / 100;

/* two-centre pointed arch — proper geometry, correct spring line.
   Returns a path from left spring, up over the apex, down to right spring. */
function archPath(cx, halfW, springY, sharp) {
  const d = halfW * (sharp == null ? .38 : sharp);   /* centre offset */
  const R = halfW + d;
  const apexY = springY - Math.sqrt(Math.max(0, R * R - d * d));
  return {
    d: `M${r2(cx - halfW)} ${r2(springY)}A${r2(R)} ${r2(R)} 0 0 1 ${r2(cx)} ${r2(apexY)}A${r2(R)} ${r2(R)} 0 0 1 ${r2(cx + halfW)} ${r2(springY)}`,
    apexY
  };
}
/* 2n-fold compass rosette as a single path — hairline construction */
function rosettePath(cx, cy, R, n, inner) {
  let d = '';
  for (let a = 0; a < n; a++) {
    const t = (a / n) * Math.PI * 2, t2 = ((a + .5) / n) * Math.PI * 2;
    d += (a ? 'L' : 'M') + r2(cx + Math.cos(t) * R) + ' ' + r2(cy + Math.sin(t) * R)
       + 'L' + r2(cx + Math.cos(t2) * R * (inner || .58)) + ' ' + r2(cy + Math.sin(t2) * R * (inner || .58));
  }
  return d + 'Z';
}
/* girih tile unit: an 8-point star with connecting straps, for tessellation */
function girihUnit(u) {
  const c = u / 2, R = u * .46;
  let star = '';
  for (let a = 0; a < 8; a++) {
    const t = (a / 8) * Math.PI * 2 - Math.PI / 8, t2 = ((a + .5) / 8) * Math.PI * 2 - Math.PI / 8;
    star += (a ? 'L' : 'M') + r2(c + Math.cos(t) * R) + ' ' + r2(c + Math.sin(t) * R)
          + 'L' + r2(c + Math.cos(t2) * R * .41) + ' ' + r2(c + Math.sin(t2) * R * .41);
  }
  star += 'Z';
  const arm = `M0 ${r2(c)}H${r2(c - R * .93)}M${r2(c + R * .93)} ${r2(c)}H${u}M${r2(c)} 0V${r2(c - R * .93)}M${r2(c)} ${r2(c + R * .93)}V${u}`;
  return star + arm;
}
/* Square-Kufic block field. Deterministic meander, not noise: continuous
   vertical stems with horizontal ties alternating between blocks — which is
   how al-Kufi al-murabba' actually reads. No randomness anywhere. */
function kuficField(cols, rows, u) {
  let p = '';
  const on = (x, y) => {
    if (x % 4 === 0) return true;                                   /* stems */
    const bx = Math.floor(x / 4), by = Math.floor(y / 4);
    if (y % 4 === 0 && (bx + by) % 2 === 0) return true;            /* upper ties */
    if (y % 4 === 2 && (bx + by) % 2 === 1) return true;            /* lower ties */
    if (y % 8 === 6 && x % 8 === 2) return true;                    /* counters */
    return false;
  };
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
    if (on(x, y)) p += `<rect x="${r2(x * u)}" y="${r2(y * u)}" width="${r2(u * 1.02)}" height="${r2(u * 1.02)}"/>`;
  return p;
}

const BG = {};
const bgDef = (id, ar, tier, fn) => { BG[id] = { id, ar, tier, fn }; };

/* ══ TIER 1 — their motifs, done properly ═════════════════════════ */

bgDef('wave', 'الموجة', 1, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o), I = INF(o);
  const bottom = o.placement === 'band' || o.placement === 'full';
  const hR = H * .062 * s, hL = H * .172 * s;           /* right/left edge heights */
  const d = `M0 0H${W}V${r2(hR)}C${r2(W * .66)} ${r2(hR + H * .05)} ${r2(W * .30)} ${r2(hL + H * .04)} 0 ${r2(hL)}Z`;
  const hair = `M${W} ${r2(hR + H * .026)}C${r2(W * .66)} ${r2(hR + H * .076)} ${r2(W * .30)} ${r2(hL + H * .066)} 0 ${r2(hL + H * .026)}`;
  let sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <path d="${d}" fill="${t.fig}" opacity="${I}"/>
    <path d="${hair}" fill="none" stroke="${t.gold}" stroke-width="${r2(1.4 * WTF(o) / 2 + .7)}" opacity="${.9 * I}"/>`;
  let safe = { ...DEF_SAFE, y: r2(hL / H * 100 + 3.6) };
  safe.h = r2(100 - safe.y - 5.4);   /* the footer wants to sit low, as it does on the reference */
  if (bottom) {
    const bR = H * .055 * s, bL = H * .125 * s;
    sv += `<path d="M0 ${H}H${W}V${r2(H - bR)}C${r2(W * .68)} ${r2(H - bR - H * .04)} ${r2(W * .3)} ${r2(H - bL - H * .03)} 0 ${r2(H - bL)}Z" fill="${t.alt}" opacity="${I}"/>`;
    safe.h = r2(100 - safe.y - bL / H * 100 - 3);
  }
  return { svg: sv, safe };
});

bgDef('arch', 'العقد', 1, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o), I = INF(o), wt = WTF(o);
  const m = W * .062, cx = W / 2, halfW = (W - m * 2) / 2;
  /* Derive the spring line FROM the desired apex, not the other way round —
     picking a spring height directly pushes the apex off the top of the canvas
     on tall formats, and the arch stops reading as an arch. */
  const apexY = H * (o.placement === 'center' ? .028 : .042) * (2 - s);
  const SHARP = .22;              /* gentler than Gothic — Cairene two-centre proportions */
  const dOff = halfW * SHARP, R = halfW + dOff;
  const rise = Math.sqrt(Math.max(1, R * R - dOff * dOff));
  const spring = clamp(apexY + rise, H * .18, H * .68);
  const a1 = archPath(cx, halfW, spring, SHARP);
  const a2 = archPath(cx, halfW - W * .028, spring, SHARP);
  const foot = H * .93;
  const sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <path d="${a1.d}" fill="none" stroke="${t.fig}" stroke-width="${2.4 * wt}" opacity="${I}"/>
    <path d="M${r2(cx - halfW)} ${r2(spring)}V${r2(foot)}M${r2(cx + halfW)} ${r2(spring)}V${r2(foot)}" stroke="${t.fig}" stroke-width="${2.4 * wt}" opacity="${I}"/>
    <path d="${a2.d}" fill="none" stroke="${t.gold}" stroke-width="1.6" opacity="${.85 * I}"/>
    <path d="M${r2(cx - halfW + W * .028)} ${r2(spring)}V${r2(foot - H * .012)}M${r2(cx + halfW - W * .028)} ${r2(spring)}V${r2(foot - H * .012)}" stroke="${t.gold}" stroke-width="1.6" opacity="${.85 * I}"/>
    <path d="M${r2(cx - halfW - W * .022)} ${r2(foot)}H${r2(cx + halfW + W * .022)}" stroke="${t.fig}" stroke-width="${2.4 * wt}" opacity="${I}"/>
    <path d="M${r2(cx)} ${r2(a1.apexY - H * .026)}v${r2(H * .022)}" stroke="${t.gold}" stroke-width="2.2"/>
    <circle cx="${r2(cx)}" cy="${r2(a1.apexY - H * .034)}" r="${r2(W * .009)}" fill="none" stroke="${t.gold}" stroke-width="1.8"/>`;
  /* Start content below the crest, then take the width the arch actually has
     AT that height — the frame narrows above the spring line, so a constant
     safe width lets long lines cross the gold rule. */
  const top = Math.max(MARGIN + 4, a1.apexY / H * 100 + 13);
  /* Measure the arch a little BELOW the top of the content area, not right at
     it: the first line is short and centred and can live in the narrow part,
     while the body gets a column that is actually usable. */
  const refY = top / 100 * H + (foot - top / 100 * H) * .10;
  const halfAtY = refY >= spring ? halfW
    : Math.min(halfW, Math.sqrt(Math.max(1, R * R - Math.pow(refY - spring, 2))) - dOff);
  const inset = W * .03;
  const x0 = clamp(cx - halfAtY + inset, m, W / 2 - W * .16);
  return {
    svg: sv,
    safe: { x: r2(x0 / W * 100), y: r2(top), w: r2((W - 2 * x0) / W * 100), h: r2(foot / H * 100 - top - 3.5) }
  };
});

bgDef('skyline', 'أفق المسجد', 1, (P, o, W, H) => {
  /* Flat constructed geometry — domes are true arcs on drums, minarets are
     tapered shafts with a balcony and a cap. Anchored to a baseline rule:
     that anchoring is the only reason this ornament earns its place (§7). */
  const t = tones(P, o), s = SCF(o), I = INF(o);
  const base = H * (o.placement === 'center' ? .74 : .855);
  const U = W * .001 * s;
  const dome = (cx, r, drum) => {
    const springY = base - drum;
    return `<path d="M${r2(cx - r)} ${r2(base)}V${r2(springY)}A${r2(r)} ${r2(r * 1.18)} 0 0 1 ${r2(cx + r)} ${r2(springY)}V${r2(base)}Z"/>`
      + `<path d="M${r2(cx)} ${r2(springY - r * 1.18)}v${r2(-r * .38)}" stroke-width="${r2(U * 7)}" stroke="currentColor" fill="none"/>`
      + `<circle cx="${r2(cx)}" cy="${r2(springY - r * 1.18 - r * .52)}" r="${r2(r * .13)}"/>`;
  };
  const minaret = (cx, w, hh) => {
    const capY = base - hh;
    return `<path d="M${r2(cx - w)} ${r2(base)}L${r2(cx - w * .62)} ${r2(capY + w * 2.4)}H${r2(cx + w * .62)}L${r2(cx + w)} ${r2(base)}Z"/>`
      + `<rect x="${r2(cx - w * 1.25)}" y="${r2(capY + w * 1.5)}" width="${r2(w * 2.5)}" height="${r2(w * .95)}"/>`
      + `<path d="M${r2(cx - w * .62)} ${r2(capY + w * 1.5)}L${r2(cx - w * .38)} ${r2(capY)}H${r2(cx + w * .38)}L${r2(cx + w * .62)} ${r2(capY + w * 1.5)}Z"/>`
      + `<path d="M${r2(cx - w * .38)} ${r2(capY)}Q${r2(cx)} ${r2(capY - w * 1.5)} ${r2(cx + w * .38)} ${r2(capY)}Z"/>`
      + `<path d="M${r2(cx)} ${r2(capY - w * 1.1)}v${r2(-w * .8)}" stroke-width="${r2(U * 6)}" stroke="currentColor" fill="none"/>`;
  };
  const hallH = H * .062 * s, hallX = W * .215, hallW = W * .57;
  let body = `<rect x="${r2(hallX)}" y="${r2(base - hallH)}" width="${r2(hallW)}" height="${r2(hallH)}"/>`;
  /* arcade of pointed openings knocked out of the prayer hall */
  const nA = 5, aw = hallW / nA;
  for (let i = 0; i < nA; i++) {
    const cx = hallX + aw * (i + .5), r = aw * .28, sp = base - hallH * .18;
    body += `<path d="${archPath(cx, r, sp, .34).d}V${r2(base)}H${r2(cx - r)}Z" fill="${t.ground}"/>`;
  }
  body += dome(W * .5, W * .135 * s, hallH) + dome(W * .285, W * .066 * s, hallH * .82) + dome(W * .715, W * .066 * s, hallH * .82);
  const sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <g fill="${t.fig}" color="${t.fig}" opacity="${I}">${minaret(W * .095, W * .019 * s, H * .175 * s)}${minaret(W * .905, W * .019 * s, H * .175 * s)}${body}</g>
    <path d="M0 ${r2(base)}H${W}" stroke="${t.fig}" stroke-width="${r2(2.4 * WTF(o))}" opacity="${I}"/>
    <path d="M0 ${r2(base + H * .0115)}H${W}" stroke="${t.gold}" stroke-width="1.6" opacity="${.9 * I}"/>`;
  const top = (base - H * .175 * s - H * .05) / H * 100;
  return { svg: sv, safe: { x: MARGIN, y: MARGIN, w: 100 - 2 * MARGIN, h: r2(Math.max(30, top - MARGIN)) } };
});

bgDef('frame', 'الإطار', 1, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o), I = INF(o), wt = WTF(o);
  const m = Math.min(W, H) * .052 * (o.scale === 'grand' ? .72 : o.scale === 'tight' ? 1.25 : 1);
  const g = m + Math.min(W, H) * .017;
  const R = Math.min(W, H) * .052 * s;
  let ros = '';
  [[m, m], [W - m, m], [m, H - m], [W - m, H - m]].forEach(([x, y]) => {
    /* One rosette and one centre dot per corner. The inner ring that used to sit
       between them was texture, not construction — removed in the design pass. */
    ros += `<circle cx="${r2(x)}" cy="${r2(y)}" r="${r2(R * .96)}" fill="${t.ground}"/>
      <path d="${rosettePath(x, y, R, 8, .5)}" fill="none" stroke="${t.gold}" stroke-width="1.6" opacity="${I}" stroke-linejoin="miter"/>
      <circle cx="${r2(x)}" cy="${r2(y)}" r="${r2(R * .15)}" fill="${t.gold}" opacity="${I}"/>`;
  });
  const sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <rect x="${r2(m)}" y="${r2(m)}" width="${r2(W - 2 * m)}" height="${r2(H - 2 * m)}" fill="none" stroke="${t.fig}" stroke-width="${r2(2.2 * wt)}" opacity="${I}"/>
    <rect x="${r2(g)}" y="${r2(g)}" width="${r2(W - 2 * g)}" height="${r2(H - 2 * g)}" fill="none" stroke="${t.gold}" stroke-width="1.4" opacity="${.9 * I}"/>
    ${ros}`;
  const p = (g + Math.min(W, H) * .034);
  return { svg: sv, safe: { x: r2(p / W * 100), y: r2(p / H * 100), w: r2(100 - 2 * p / W * 100), h: r2(100 - 2 * p / H * 100) } };
});

bgDef('banner', 'الشريط', 1, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o), I = INF(o);
  const bh = H * .163 * s;
  /* A real muqarnas hood in elevation: symmetric corbelled tiers stepping
     down to the centre. Not a decorative scallop. */
  const segs = 13, tiers = 5, sw = W / segs, sh = H * .0135;
  /* spread the corbels across the full width — a tight cluster in the middle
     reads as a notch, not as a hood */
  const lvl = i => Math.max(0, (tiers - 1) - Math.round(Math.abs(i - (segs - 1) / 2) * .7));
  let d = `M0 0H${W}V${r2(bh)}`;
  for (let i = segs - 1; i >= 0; i--) {
    const y = bh + lvl(i) * sh;
    d += `L${r2((i + 1) * sw)} ${r2(y)}L${r2(i * sw)} ${r2(y)}`;
  }
  d += 'Z';
  /* tier rules inside the hood — the corbels read as construction, not texture */
  let inner = '';
  for (let i = 0; i < segs; i++) {
    const y = bh + lvl(i) * sh;
    if (i > 0 && lvl(i) !== lvl(i - 1)) inner += `M${r2(i * sw)} ${r2(Math.min(y, bh + lvl(i - 1) * sh))}V${r2(bh - sh * 1.4)}`;
  }
  const low = bh + (tiers - 1) * sh;
  let sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <path d="${d}" fill="${t.fig}" opacity="${I}"/>
    <path d="${inner}" stroke="${t.gold}" stroke-width="1.2" opacity="${.45 * I}" fill="none"/>
    <path d="M0 ${r2(low + H * .011)}H${W}" stroke="${t.gold}" stroke-width="${r2(1.4 * WTF(o) / 2 + .7)}" opacity="${.9 * I}"/>`;
  let safeH = 100 - (low + H * .011) / H * 100 - MARGIN;
  if (o.placement === 'band' || o.placement === 'full') {

bgDef('mashrabiya', 'مشربية', 2, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o);
  const I = (o.intensity == null ? 100 : o.intensity) / 100;
  const bw = W * (o.scale === 'grand' ? .40 : o.scale === 'tight' ? .22 : .30);
  const left = o.placement !== 'corner';                     /* band on the left, text starts clear at the right */
  const bx = left ? 0 : W - bw;
  const u = bw * .175;
  /* turned-wood lattice: interlocking circles on a hex offset — real mashrabiya logic */
  let cells = '';
  const rows = Math.ceil(H / (u * .866)) + 2, cols = Math.ceil(bw / u) + 2;
  for (let r = -1; r < rows; r++) for (let c = -1; c < cols; c++) {
    const cx = c * u + (r % 2 ? u / 2 : 0), cy = r * u * .866;
    cells += `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(u * .5)}"/>`;
    cells += `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(u * .19)}"/>`;
  }
  const sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <g transform="translate(${r2(bx)},0)">
      <rect width="${r2(bw)}" height="${H}" fill="${t.fig}" opacity="${r2(.94 * I)}"/>
      <g clip-path="url(#mclip)" fill="none" stroke="${t.ground}" stroke-width="${r2(u * .085 * WTF(o) / 2 + 1)}" opacity="${r2(.55 * I)}">${cells}</g>
    </g>
    <defs><clipPath id="mclip"><rect width="${r2(bw)}" height="${H}"/></clipPath></defs>
    <path d="M${r2(left ? bw : W - bw)} 0V${H}" stroke="${t.gold}" stroke-width="2.2" opacity="${I}"/>`;
  const clearX = left ? bw / W * 100 + 5 : MARGIN;
  return { svg: sv, safe: { x: r2(clearX), y: MARGIN, w: r2(100 - clearX - (left ? MARGIN : bw / W * 100 + 5)), h: 100 - 2 * MARGIN } };
});

bgDef('kufic', 'كوفي مربّع', 2, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o);

  const sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <g transform="translate(0,${r2(y0)})" fill="${t.fig}" opacity="${r2((o.placement === 'full' ? .1 : .95) * I)}">${kuficField(cols, rows, u)}</g>

  const safe = o.placement === 'full'

      : { x: MARGIN, y: r2((bandH + u * 2.2) / H * 100 + 3), w: 100 - 2 * MARGIN, h: r2(100 - (bandH + u * 2.2) / H * 100 - 3 - MARGIN) };

});

bgDef('inverted', 'الحقل الداكن', 2, (P, o, W, H) => {
  /* flat dark field — the poster type they have never made. The `inverted`
     option on every other background is the same idea generalised. */
  const inv = !o.inverted;                    /* this bg IS the inversion; the opt un-inverts it */
  const ground = inv ? P.deep : P.paper, fg = inv ? P.paper : P.deep;
  const gold = inv ? mix(P.gold, '#ffffff', .18) : P.gold;
  const m = Math.min(W, H) * .045 * (o.scale === 'grand' ? .7 : o.scale === 'tight' ? 1.3 : 1);
  const I = INF(o);
  let sv = `<rect width="${W}" height="${H}" fill="${ground}"/>
    <rect x="${r2(m)}" y="${r2(m)}" width="${r2(W - 2 * m)}" height="${r2(H - 2 * m)}" fill="none" stroke="${gold}" stroke-width="${r2(1.3 * WTF(o) / 2 + .6)}" opacity="${r2(.85 * I)}"/>`;

bgDef('calligraphic-ground', 'كلمة خلفية', 2, (P, o, W, H) => {

      fill="${t.fig}" opacity="${r2(.04 * I)}" text-anchor="middle" dominant-baseline="middle" direction="rtl">${esc(word)}</text>
    <path d="M${r2(W * .1)} ${r2(H * .875)}H${r2(W * .9)}" stroke="${t.gold}" stroke-width="1.5" opacity=".8"/>`;

});

bgDef('zellige', 'زليج', 2, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o), I = INF(o);
  const bw = H * (o.scale === 'grand' ? .175 : o.scale === 'tight' ? .085 : .125);
  const edge = o.placement === 'corner' ? 'top' : o.placement === 'band' ? 'both' : 'bottom';
  const u = bw / 2;
  /* interlocking 8-point zellij: alternating stars and crosses on a square grid */
  let unit = '';
  const R = u * .92, c = u;
  let star = '';
  for (let a = 0; a < 8; a++) {
    const t1 = (a / 8) * Math.PI * 2, t2 = ((a + .5) / 8) * Math.PI * 2;
    star += (a ? 'L' : 'M') + r2(c + Math.cos(t1) * R) + ' ' + r2(c + Math.sin(t1) * R)
          + 'L' + r2(c + Math.cos(t2) * R * .414) + ' ' + r2(c + Math.sin(t2) * R * .414);
  }
  /* zellij: 8-point star tile with the interlacing cross that fills between
     stars, cut by the ground-coloured joint lines that mortar actually makes */
  unit = `<rect width="${r2(u * 2)}" height="${r2(u * 2)}" fill="${t.fig}"/>
    <path d="M${r2(c)} 0L${r2(u * 2)} ${r2(c)}L${r2(c)} ${r2(u * 2)}L0 ${r2(c)}Z" fill="${t.gold}" opacity=".28"/>
    <path d="${star}Z" fill="${t.gold}"/>
    <path d="M${r2(c)} 0L${r2(u * 2)} ${r2(c)}L${r2(c)} ${r2(u * 2)}L0 ${r2(c)}Z" fill="none" stroke="${t.ground}" stroke-width="${r2(u * .085)}"/>
    <path d="M0 0h${r2(u * 2)}v${r2(u * 2)}h${r2(-u * 2)}Z" fill="none" stroke="${t.ground}" stroke-width="${r2(u * .085)}"/>`;
  const band = y => `<g clip-path="url(#zc${r2(y)})"><rect y="${r2(y)}" width="${W}" height="${r2(bw)}" fill="url(#pz)" opacity="${I}"/></g>`;
  const sv = `<defs>
      <pattern id="pz" width="${r2(u * 2)}" height="${r2(u * 2)}" patternUnits="userSpaceOnUse">${unit}</pattern>
      <clipPath id="zc0"><rect y="0" width="${W}" height="${r2(bw)}"/></clipPath>
      <clipPath id="zc${r2(H - bw)}"><rect y="${r2(H - bw)}" width="${W}" height="${r2(bw)}"/></clipPath>
    </defs>
    <rect width="${W}" height="${H}" fill="${t.ground}"/>
    ${edge !== 'bottom' ? band(0) + `<path d="M0 ${r2(bw)}H${W}" stroke="${t.gold}" stroke-width="2"/>` : ''}
    ${edge !== 'top' ? band(H - bw) + `<path d="M0 ${r2(H - bw)}H${W}" stroke="${t.gold}" stroke-width="2"/>` : ''}`;
  const topPad = edge !== 'bottom' ? bw / H * 100 + 4.5 : MARGIN;
  const botPad = edge !== 'top' ? bw / H * 100 + 4.5 : MARGIN;
  return { svg: sv, safe: { x: MARGIN, y: r2(topPad), w: 100 - 2 * MARGIN, h: r2(100 - topPad - botPad) } };
});

bgDef('negative-arch', 'العقد المفرّغ', 2, (P, o, W, H) => {

    <path d="${archPath(cx, halfW - W * .022, spring, .34).d}V${r2(foot - H * .016)}H${r2(cx - halfW + W * .022)}Z" fill="none" stroke="${t.gold}" stroke-width="1.6" opacity=".9"/>`;
  const top = a.apexY / H * 100 + 7;

});

bgDef('edge-wash', 'إبرو', 2, (P, o, W, H) => {
  /* marbled ebru wash — paper marbling is a print technique, so it stays
     inside the "printed, not generated" rule. One edge only. */
  const t = tones(P, o), s = SCF(o), I = INF(o);
  const wide = H * (o.scale === 'grand' ? .46 : o.scale === 'tight' ? .22 : .33);
  const bottom = o.placement !== 'corner';
  let bands = '';
  const n = 9;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const col = i % 3 === 1 ? t.gold : i % 3 === 2 ? mix(t.fig, t.ground, .45) : t.fig;
    const y = bottom ? H - wide * (1 - f * .92) : wide * (1 - f * .92);
    bands += `<path d="M${r2(-W * .1)} ${r2(y)}H${r2(W * 1.1)}" stroke="${col}" stroke-width="${r2(wide * .2 * (1 - f * .6))}" opacity="${r2((.95 - f * .65) * I)}"/>`;
  }
  const sv = `<defs>
      <filter id="ebru" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="${r2(.0016 / s)} ${r2(.02 / s)}" numOctaves="5" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="${r2(Math.min(W, H) * .3 * s)}" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
    <rect width="${W}" height="${H}" fill="${t.ground}"/>
    <g filter="url(#ebru)">${bands}</g>
    <path d="M0 ${r2(bottom ? H - wide - H * .015 : wide + H * .015)}H${W}" stroke="${t.gold}" stroke-width="1.4" opacity=".65"/>`;
  return {
    svg: sv,
    safe: bottom
      ? { x: MARGIN, y: MARGIN, w: 100 - 2 * MARGIN, h: r2(100 - wide / H * 100 - MARGIN - 4) }
      : { x: MARGIN, y: r2(wide / H * 100 + 4), w: 100 - 2 * MARGIN, h: r2(100 - wide / H * 100 - 4 - MARGIN) }
  };
});

bgDef('duotone-photo', 'صورة ثنائية اللون', 2, (P, o, W, H) => {
  const t = tones(P, o), I = INF(o);

  const mat = `${r2(lr - dr)} 0 0 0 ${r2(dr)} 0 ${r2(lg - dg)} 0 0 ${r2(dg)} 0 0 ${r2(lb - db)} 0 ${r2(db)} 0 0 0 1 0`;
  const scrimTop = o.placement === 'corner' ? 0 : .42;

        <feComponentTransfer><feFuncR type="table" tableValues="${r2(dr)} ${r2(lr)}"/><feFuncG type="table" tableValues="${r2(dg)} ${r2(lg)}"/><feFuncB type="table" tableValues="${r2(db)} ${r2(lb)}"/></feComponentTransfer></filter>
      <linearGradient id="scr" x1="0" y1="${scrimTop}" x2="0" y2="1"><stop offset="0" stop-color="${dark}" stop-opacity="0"/><stop offset="1" stop-color="${dark}" stop-opacity="${r2(.88 * I)}"/></linearGradient>
    </defs>
    <rect width="${W}" height="${H}" fill="${t.ground}"/>
    ${src ? `<image href="${src}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice" filter="url(#duo)" opacity="${I}"/>` : `<rect width="${W}" height="${H}" fill="${mix(t.fig, t.ground, .55)}"/><text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-family="Cairo,sans-serif" font-size="${r2(W * .035)}" fill="${t.ground}" opacity=".8">ارفع صورة من لوحة الخلفية</text>`}
    <rect width="${W}" height="${H}" fill="url(#scr)"/>
    <path d="M${r2(W * .09)} ${r2(H * .93)}H${r2(W * .91)}" stroke="${t.gold}" stroke-width="1.5" opacity=".8"/>`;
  return { svg: sv, safe: { x: 9, y: 46, w: 82, h: 45 }, forceInk: 'paper' };
});

bgDef('radial-rosette', 'وردة كبرى', 2, (P, o, W, H) => {
  const t = tones(P, o), s = SCF(o);
  const I = (o.intensity == null ? 100 : o.intensity) / 100;
  const R = W * .72 * s;
  const pos = { corner: [W * .92, H * .06], edge: [W * .04, H * .96], band: [W * .5, H * 1.02], full: [W * .5, H * .5], center: [W * .5, H * .5] }[o.placement] || [W * .92, H * .06];
  /* One oversized compass construction bleeding off a corner. The circles are
     the construction; the rosette is what the compass produces from them.
     Hairline only — this is a drawing, not a decoration. */
  const wt = r2(1.1 * WTF(o) / 2 + .5);
  let cons = '';
  [.22, .38, .52, .68, .84, 1].forEach(f =>
    cons += `<circle cx="${r2(pos[0])}" cy="${r2(pos[1])}" r="${r2(R * f)}" fill="none" stroke="${t.fig}" stroke-width="${wt}" opacity="${r2(.16 * I)}"/>`);
  let spokes = '';
  for (let a = 0; a < 16; a++) {
    const th = (a / 16) * Math.PI * 2;
    spokes += `M${r2(pos[0] + Math.cos(th) * R * .22)} ${r2(pos[1] + Math.sin(th) * R * .22)}L${r2(pos[0] + Math.cos(th) * R)} ${r2(pos[1] + Math.sin(th) * R)}`;
  }
  cons += `<path d="${spokes}" stroke="${t.fig}" stroke-width="${wt}" opacity="${r2(.13 * I)}" fill="none"/>`;
  cons += `<path d="${rosettePath(pos[0], pos[1], R * .84, 16, .66)}" fill="none" stroke="${t.gold}" stroke-width="${r2(wt + .5)}" opacity="${r2(.75 * I)}" stroke-linejoin="miter"/>`;
  cons += `<path d="${rosettePath(pos[0], pos[1], R * .38, 16, .66)}" fill="none" stroke="${t.gold}" stroke-width="${wt}" opacity="${r2(.5 * I)}" stroke-linejoin="miter"/>`;
  const sv = `<rect width="${W}" height="${H}" fill="${t.ground}"/>
    <g clip-path="url(#rr)">${cons}</g>
    <defs><clipPath id="rr"><rect width="${W}" height="${H}"/></clipPath></defs>`;
  const low = pos[1] < H * .5;
  return { svg: sv, safe: low ? { x: MARGIN, y: 30, w: 100 - 2 * MARGIN, h: 61 } : { x: MARGIN, y: MARGIN, w: 100 - 2 * MARGIN, h: 62 } };
});

bgDef('upload', 'صورتك', 2, (P, o, W, H) => {
  const t = tones(P, o), I = INF(o);
  const src = (typeof DOC !== 'undefined' && DOC.bgImage) || null;
  const duo = o.duotone !== false;
  const scrim = (o.scrim == null ? 55 : o.scrim) / 100;
  const b = BG['duotone-photo'].fn(P, { ...o, intensity: 100 }, W, H);

/* one entry point. Every consumer (stage, previews, export) goes through this. */
function buildBG(id, palId, opts, W, H) {
  const P = PAL[palId] || PAL.gsc;
  const o = { ...DEF_OPTS, ...(opts || {}) };
  const def = BG[id] || BG.wave;
  let out;
  try { out = def.fn(P, o, W, H); }
  catch (e) { console.warn('bg failed', id, e); out = { svg: `<rect width="${W}" height="${H}" fill="${P.paper}"/>`, safe: DEF_SAFE }; }
  /* scope ids so multiple SVGs on one page (previews!) never collide */
  const ns = 'b' + Math.random().toString(36).slice(2, 7);
  out.svg = out.svg.replace(/id="([a-z0-9.\-]+)"/gi, (m, g) => `id="${ns}${g}"`)
                   .replace(/url\(#([a-z0-9.\-]+)\)/gi, (m, g) => `url(#${ns}${g})`);
  out.safe = { ...DEF_SAFE, ...out.safe };
  return out;
}

  `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">${buildBG(id, palId, opts, W, H).svg}</svg>`;

function snap(label) {
  if (HIST.busy) return;
  HIST.past.push(JSON.stringify(DOC));
  if (HIST.past.length > HIST.cap) HIST.past.shift();
  HIST.future.length = 0;
  updateHistBtns(); saveLocal();
}
function undo() {
  if (!HIST.past.length) return;
  HIST.future.push(JSON.stringify(DOC));
  DOC = JSON.parse(HIST.past.pop());
  HIST.busy = true; afterDocSwap(); HIST.busy = false;
  updateHistBtns(); toast(t('undone'));
}
function redo() {
  if (!HIST.future.length) return;
  HIST.past.push(JSON.stringify(DOC));
  DOC = JSON.parse(HIST.future.pop());
  HIST.busy = true; afterDocSwap(); HIST.busy = false;
  updateHistBtns(); toast(t('redone'));
}

/* ═══════════════════════════════════════════════════════════════════
   ARABIC HELPERS
   ═══════════════════════════════════════════════════════════════════ */
const AR_DAYS   = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
/* Levantine/Egyptian month names — from a lookup, never toLocaleDateString guesswork */
const AR_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const AR_DIG = '٠١٢٣٤٥٦٧٨٩';
const toArabicDigits = s => String(s).replace(/[0-9]/g, d => AR_DIG[+d]);
const toLatinDigits  = s => String(s).replace(/[٠-٩]/g, d => AR_DIG.indexOf(d));
/* display-time numeral conversion — never mutates the stored text */
function numFmt(html) {
  if (!DOC || !DOC.arabicNumerals) return html;
  return html.replace(/>([^<]*)</g, (m, txt) => '>' + toArabicDigits(txt) + '<')
             .replace(/^([^<]*)/, m => toArabicDigits(m));
}
function arDate(iso, opts) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return '';
  const day = AR_DAYS[d.getDay()], mon = AR_MONTHS[d.getMonth()];
  let s = `${day}، ${d.getDate()} ${mon} ${d.getFullYear()}`;
  if (opts && opts.noDay) s = `${d.getDate()} ${mon} ${d.getFullYear()}`;
  return s;
}
function hijriDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso + 'T12:00:00');
    const f = new Intl.DateTimeFormat('ar-EG-u-ca-islamic', { day: 'numeric', month: 'long', year: 'numeric' });
    return f.format(d).replace(/‏/g, '');
  } catch (e) { return ''; }
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER — full rebuild of #ellayer on every change, except the element
   being inline-edited (re-rendering it kills the caret).
   ═══════════════════════════════════════════════════════════════════ */
/* Two-centre arch as a mask, emitted at absolute size. Do NOT express this as a
   0..1 path plus transform="scale(w,h)" — the transform also scales stroke-width
   and dash arrays out of the unit space, which produces a stroke hundreds of px
   wide. Same geometry as archPath() in the background system. */
const ARCH_CLIP = 'M0 .6633A.69 .69 0 0 1 .5 0A.69 .69 0 0 1 1 .6633V1H0Z';
const archD = (w, h) => `M0 ${r2(.6633 * h)}A${r2(.69 * w)} ${r2(.69 * h)} 0 0 1 ${r2(.5 * w)} 0A${r2(.69 * w)} ${r2(.69 * h)} 0 0 1 ${r2(w)} ${r2(.6633 * h)}V${r2(h)}H0Z`;
const CREST = (a, b, c) => `<svg ${SVGNS} viewBox="0 0 100 100" style="width:100%;height:100%;display:block">
  <g fill="none" stroke-width="4"><path d="M50 6 94 50 50 94 6 50Z" stroke="${c}" stroke-width="2.5"/>
  <path d="M50 14 86 50 50 86 14 50Z" fill="${a}" stroke="none"/>
  <path d="M50 22 78 50 50 78 22 50Z" fill="${b}" stroke="none"/></g>
  <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="Reem Kufi,serif" font-size="26" font-weight="700" fill="${c}">ج ر</text></svg>`;

/* Inline colour written by the mini-toolbar is stored as a palette TOKEN,
   not a hex value, so a palette swap recolours it with everything else.
   The live style attribute is rewritten from the token at render time. */
function resolveToks(h) {
  return String(h).replace(/<span([^>]*)\sdata-tok="([a-z]+)"([^>]*)>/gi, (m, a, k, b) => {
    const attrs = (a + b).replace(/\sstyle="[^"]*"/gi, '');
    return `<span${attrs} data-tok="${k}" style="color:${C(k, null, 'text')}">`;
  });
}
function metaHTML(e) {
  const rows = (e.rows && e.rows.length ? e.rows : DEFAULT_ROWS);
  const st = e.rowStyle || 'rows';
  if (st === 'inline') {
    return `<div class="minline">` + rows.map(r =>
      `<span class="mcell">${r.icon && r.icon !== 'none' ? `<span class="mi">${icoSvg(r.icon)}</span>` : ''}<span class="mt">${r.text || ''}</span></span>`)
      .join('<span class="vline"></span>') + `</div>`;
  }
  if (st === 'boxed') {
    return `<div class="mstack boxed">` + rows.map((r, i) =>
      `<div class="mrowx">${r.icon && r.icon !== 'none' ? `<span class="mi">${icoSvg(r.icon)}</span>` : ''}<span class="mt">${r.text || ''}</span></div>`
      + (i < rows.length - 1 ? '<div class="msep solid"></div>' : '')).join('') + `</div>`;
  }
  /* 'rows' — icon column, vertical rule, dotted separators. Poster 1. */
  return `<div class="mstack">` + rows.map((r, i) =>
    `<div class="mrowx">${r.icon && r.icon !== 'none' ? `<span class="mi">${icoSvg(r.icon)}</span><span class="vl"></span>` : ''}<span class="mt">${r.text || ''}</span></div>`
    + (i < rows.length - 1 ? '<div class="msep"></div>' : '')).join('') + `</div>`;
}

function innerHTMLFor(e) {
  const K = DOC.W / 1080;
  if (e.type === 'divider') return ornSvg(e.orn || 'rule', C(e.color || 'gold'));
  if (e.type === 'meta')    return numFmt(metaHTML(e));
  if (e.type === 'panel')   return '';
  if (e.type === 'qr') {
    const s = qrSVG(e.qrUrl, C('ink'), C('paper'));
    return s || `<div class="qrph" style="color:${C('ink')};border-color:${C('ink')}">${icoSvg('link')}<span>ضع رابطاً</span></div>`;
  }
  if (e.type === 'image') {
    if (!e.src) {
      if (e.role !== 'photo') return CREST(C('alt'), C('deep'), C('gold'));
      /* the placeholder shows the actual mask shape, so the committee can see
         what the frame will do before they have a photo to put in it */
      const pw = Math.max(1, e.w / 100 * DOC.W), ph = Math.max(1, (e.h || 20) / 100 * DOC.H);
      const shape = e.mask === 'arch' ? `<path d="${archD(pw, ph)}"/>`
        : e.mask === 'circle' ? `<ellipse cx="${r2(pw / 2)}" cy="${r2(ph / 2)}" rx="${r2(pw / 2)}" ry="${r2(ph / 2)}"/>`
        : `<rect width="${r2(pw)}" height="${r2(ph)}" rx="${e.mask === 'rounded' ? r2(Math.min(pw, ph) * .09) : 0}"/>`;
      return `<svg ${SVGNS} viewBox="0 0 ${r2(pw)} ${r2(ph)}" preserveAspectRatio="none" style="width:100%;height:100%;display:block">
        <g fill="${C('deep')}" opacity=".1">${shape}</g>
        <g fill="none" stroke="${C('deep')}" stroke-width="${r2(Math.min(pw, ph) * .008)}" stroke-dasharray="${r2(pw * .022)} ${r2(pw * .018)}" opacity=".45">${shape}</g>
        <text x="${r2(pw / 2)}" y="${r2(ph * .58)}" text-anchor="middle" font-family="Cairo,sans-serif" font-size="${r2(Math.min(pw, ph) * .085)}" fill="${C('deep')}" opacity=".55" direction="rtl">صورة المتحدث</text></svg>`;
    }
    /* Rendered as inline SVG rather than <img>+clip-path: the arch mask and
       the duotone both survive html2canvas this way, and the mask uses the
       same two-centre geometry as the arch background. */
    const pw = Math.max(1, e.w / 100 * DOC.W), ph = Math.max(1, (e.h || 20) / 100 * DOC.H);
    const cid = 'ic' + e.id, fid = 'if' + e.id;
    const deep = C('deep'), paper = C('paper');
    const hx = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16) / 255);
    const [dr, dg, db] = hx(deep), [lr, lg, lb] = hx(paper);
    const clip = e.mask === 'arch' ? `<clipPath id="${cid}"><path d="${archD(pw, ph)}"/></clipPath>`
      : e.mask === 'circle' ? `<clipPath id="${cid}"><ellipse cx="${r2(pw / 2)}" cy="${r2(ph / 2)}" rx="${r2(pw / 2)}" ry="${r2(ph / 2)}"/></clipPath>`
      : e.mask === 'rounded' ? `<clipPath id="${cid}"><rect width="${r2(pw)}" height="${r2(ph)}" rx="${r2(Math.min(pw, ph) * .09)}"/></clipPath>`
      : `<clipPath id="${cid}"><rect width="${r2(pw)}" height="${r2(ph)}"/></clipPath>`;
    const duo = e.duotone ? `<filter id="${fid}" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0.2126 0.7152 0.0722 0 0  0 0 0 1 0"/>
        <feComponentTransfer><feFuncR type="table" tableValues="${r2(dr)} ${r2(lr)}"/><feFuncG type="table" tableValues="${r2(dg)} ${r2(lg)}"/><feFuncB type="table" tableValues="${r2(db)} ${r2(lb)}"/></feComponentTransfer></filter>` : '';
    const z = e.zoom || 1, px = (e.panX || 0) / 100 * pw, py = (e.panY || 0) / 100 * ph;
    return `<svg viewBox="0 0 ${r2(pw)} ${r2(ph)}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block">
      <defs>${clip}${duo}</defs>
      <g clip-path="url(#${cid})">
        <image href="${e.src}" xlink:href="${e.src}" x="${r2(pw * (1 - z) / 2 + px)}" y="${r2(ph * (1 - z) / 2 + py)}" width="${r2(pw * z)}" height="${r2(ph * z)}"
          preserveAspectRatio="xMidYMid slice" ${e.duotone ? `filter="url(#${fid})"` : ''}/>
      </g></svg>`;
  }
  return numFmt(resolveToks(e.html || ''));
}

function styleEl(node, e) {
  const K = DOC.W / 1080;
  const s = node.style;
  s.left = e.x + '%'; s.top = e.y + '%'; s.width = e.w + '%';
  s.height = e.h != null ? e.h + '%' : 'auto';
  s.opacity = e.opacity == null ? 1 : e.opacity;
  s.zIndex = e.z || 10;
  s.transform = e.rotation ? `rotate(${e.rotation}deg)` : '';
  s.transformOrigin = 'center center';
  s.borderRadius = (e.radius || 0) * K + 'px';
  s.padding = (e.padding || 0) / 100 * DOC.W + 'px';
  s.background = e.fill ? C(e.fill) : '';
  s.border = e.borderW ? `${r2((e.borderW || 1) * K)}px solid ${C(e.borderColor || 'gold')}` : '';
  s.overflow = e.type === 'image' || e.type === 'qr' ? 'hidden' : 'visible';
  if (e.type === 'text' || e.type === 'meta') {
    s.fontFamily = `'${e.font === 'head' ? DOC.fonts.head : e.font === 'body' ? DOC.fonts.body : (e.font || DOC.fonts.body)}',serif`;
    s.fontSize = r2((e.size || 40) * K) + 'px';
    s.fontWeight = e.weight || 400;
    s.color = C(e.color || 'ink', null, 'text');
    s.textAlign = e.align || 'center';
    s.lineHeight = e.lineHeight || LH[e.role] || 1.45;
    s.letterSpacing = e.letterSpacing ? e.letterSpacing * K + 'px' : '0';
    s.direction = e.dir || 'rtl';
    s.unicodeBidi = 'plaintext';
  }
  /* masks are applied inside the element's own SVG (export-safe), not via
     CSS clip-path, which html2canvas does not reliably support */
}

function render(skipId) {
  const st = $('#stage'), bl = $('#bglayer'), lay0 = $('#ellayer');
  st.style.width = DOC.W + 'px'; st.style.height = DOC.H + 'px';
  const b = buildBG(DOC.bg, DOC.palette, DOC.bgOpts, DOC.W, DOC.H);
  DOC.safe = b.safe;
  st.style.background = groundColor();
  bl.innerHTML = `<svg viewBox="0 0 ${DOC.W} ${DOC.H}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${b.svg}</svg>`;

  const keep = skipId ? lay0.querySelector(`.el[data-id="${skipId}"]`) : null;
  const frag = document.createDocumentFragment();
  DOC.elements.slice().sort((a, b2) => (a.z || 10) - (b2.z || 10)).forEach(e => {
    let n;
    if (keep && e.id === skipId) { n = keep; }
    else {
      n = el('div', { class: 'el ' + e.type + (e.locked ? ' locked' : '') + (e.type === 'text' || e.type === 'meta' ? ' text' : ''), 'data-id': e.id });
      n.innerHTML = innerHTMLFor(e);
    }
    n.className = 'el ' + e.type + (e.type === 'text' || e.type === 'meta' ? ' text' : '') + (e.locked ? ' locked' : '') + (!e.locked ? ' selectable' : '');
    styleEl(n, e);
    frag.appendChild(n);
  });
  lay0.innerHTML = '';
  lay0.appendChild(frag);

  const sg = $('#safeguide'), S = DOC.safe;
  sg.style.left = S.x + '%'; sg.style.top = S.y + '%'; sg.style.width = S.w + '%'; sg.style.height = S.h + '%';
  drawSel();
  checkOverflow();
}

/* ── auto-flow ────────────────────────────────────────────────────────
   Runs on STRUCTURAL change only (layout switch, template, add/remove,
   canvas resize, font pair) — never on a keystroke. That is what makes
   "change the date without anything else moving" true (DESIGN.md C7).
   ─────────────────────────────────────────────────────────────────── */
function flow() {
  render();
  const L = LAYOUTS[DOC.layout] || {};
  const S = { ...DOC.safe };
  /* A masthead crest sits outside the flow at a fixed y. On backgrounds with no
     top band (minimal, inverted, rule-grid…) the safe area starts high enough to
     run straight into it, so reserve its height here rather than in DOC.safe —
     render() recomputes DOC.safe from the background on every pass. */
  const crest = DOC.elements.find(e => e.role === 'logo' && e.flow === false);
  if (crest) {
    const bot = crest.y + (crest.h || 0) + 1.6;
    if (bot > S.y && bot < S.y + S.h * .45) { S.h = r2(S.h - (bot - S.y)); S.y = r2(bot); }
  }
  const hOf = e => { const n = $(`.el[data-id="${e.id}"]`); return n ? n.offsetHeight / DOC.H * 100 : (e.h || 4); };
  /* Flow by ROW, not by column: elements that share an `ord` sit side by side
     on the same line (the two detail boxes in `greeting`, the two columns in
     `two-col`). Stacking each column independently from the top of the safe
     area is what made those layouts collide with the title. */
  const list = DOC.elements.filter(e => e.flow !== false && !e.pinned)
    .sort((a, b) => (a.ord || 50) - (b.ord || 50));
  const levels = [];
  list.forEach(e => {
    const o = e.ord || 50;
    if (!levels.length || levels[levels.length - 1].ord !== o) levels.push({ ord: o, els: [] });
    levels[levels.length - 1].els.push(e);
  });
  const hL = l => Math.max.apply(null, l.els.map(hOf));
  const gL = l => Math.max.apply(null, l.els.map(e => e.gap || 0));
  const body = levels.filter(l => l.ord < 99), foot = levels.filter(l => l.ord >= 99);
  const contentH = body.reduce((a, l) => a + hL(l), 0);
  const gapSum = body.reduce((a, l, i) => a + (i ? gL(l) : 0), 0);
  const footTotal = foot.reduce((a, l) => a + hL(l) + gL(l), 0);
  /* compress the gaps rather than let blocks collide — a designer tightens
     leading before they let two things overlap */
  const avail = S.h - footTotal;
  let gf = 1;
  if (contentH + gapSum > avail && gapSum > 0) gf = clamp((avail - contentH) / gapSum, .28, 1);
  let y = S.y;
  if (L.vAlign === 'center') y = S.y + Math.max(0, (S.h - footTotal - contentH - gapSum * gf) / 2);
  body.forEach((l, i) => { y += i ? gL(l) * gf : 0; l.els.forEach(e => e.y = r2(y)); y += hL(l); });
  let fy = S.y + S.h;
  foot.slice().reverse().forEach(l => {
    fy -= hL(l);
    const yy = r2(Math.max(y + 1, fy));
    l.els.forEach(e => e.y = yy);
    fy -= gL(l) * gf;
  });
  render();
}

/* ── apply a layout, preserving content BY ROLE ───────────────────── */
function applyLayout(id, silent, dropOrphans) {
  const L = LAYOUTS[id]; if (!L) return;
  DOC.layout = id;
  const S = buildBG(DOC.bg, DOC.palette, DOC.bgOpts, DOC.W, DOC.H).safe;
  DOC.safe = S;
  const old = {};
  DOC.elements.forEach(e => { if (e.role && (!old[e.role] || !e.orphan)) old[e.role] = e; });
  const free = DOC.elements.filter(e => !e.role);
  const specs = L.els(S);
  const taken = {};
  const next = specs.map(sp => {
    const prev = old[sp.role];
    const e = E(Object.assign({ type: 'text' }, sp));
    if (prev) {
      e.id = prev.id; e.locked = prev.locked;
      if (prev.html) e.html = prev.html;
      if (prev.rows) e.rows = prev.rows;
      if (prev.src) e.src = prev.src;
      if (prev.qrUrl) e.qrUrl = prev.qrUrl;
      /* only carry the ornament across if the user picked it — otherwise the
         layout's own deliberate choice would be silently overridden */
      if (prev.ornUser && e.type === 'divider') { e.orn = prev.orn; e.ornUser = true; }
      taken[sp.role] = 1;
    } else {
      if (e.type === 'meta') e.rows = deepClone(DEFAULT_ROWS);
      else if (e.type === 'text') e.html = DEFAULT_TEXT[sp.role] || '';
    }
    return e;
  });
  /* a role with no home in the new layout is kept as a free element,
     not dropped — but only if it actually holds content (DESIGN.md C6) */
  const orphans = dropOrphans ? [] : Object.keys(old).filter(r => !taken[r]).map(r => old[r])
    .filter(e => (e.html && e.html.trim()) || (e.rows && e.rows.length) || e.src)
    .map(e => Object.assign(deepClone(e), { orphan: true, flow: false, pinned: true, z: 60 }));
  DOC.elements = next.concat(free, orphans);
  flow();
  if (!silent) { syncAllPanels(); snap(); }
  if (orphans.length) toast(t('orphan').replace('{n}', orphans.length));
}

  DOC.elements.forEach(e => {

  });

  flow(); syncAllPanels(); snap();
}

/* ── overflow + contrast checks ───────────────────────────────────── */
function checkOverflow() {
  let n = 0;
  DOC.elements.forEach(e => {
    const node = $(`.el[data-id="${e.id}"]`); if (!node) return;
    const h = Math.max(node.offsetHeight, node.scrollHeight);   /* catches text spilling a fixed box */
    const over = node.offsetTop + h > DOC.H + 2 || node.offsetTop < -2
      || node.offsetLeft < -2 || node.offsetLeft + node.offsetWidth > DOC.W + 2;
    node.classList.toggle('overflowing', over);
    if (over) n++;
  });
  const w = $('#overflowNote');
  if (w) w.style.display = n ? 'block' : 'none';
  if (w && n) w.innerHTML = `<b>${n}</b> ${t('overflowWarn')}`;
  return n;
}
/* WCAG AA against the ground the element actually sits on */
function contrastReport() {
  const ground = groundColor();
  const bad = [];
  DOC.elements.forEach(e => {
    if (e.type !== 'text' && e.type !== 'meta') return;
    if (!(e.html || '').trim() && !e.rows) return;
    const fg = C(e.color || 'ink', null, 'text'), bgc = e.fill ? C(e.fill) : ground;
    const big = (e.size || 40) >= 48;
    const ratio = contrast(fg, bgc);
    if (ratio < (big ? 3 : 4.5)) bad.push({ e, ratio: Math.round(ratio * 10) / 10 });
  });
  return bad;
}

function layoutThumb(id) {
  const S = { x: 10, y: 8, w: 80, h: 84 };
  let specs = []; try { specs = LAYOUTS[id].els(S); } catch (e) {}
  let y = S.y, out = '';
  specs.filter(s => s.flow !== false).sort((a, b) => (a.ord || 50) - (b.ord || 50)).forEach(s => {
    const h = s.type === 'divider' ? 2 : s.type === 'meta' ? 12 : clamp((s.size || 40) / 1080 * 100 * 1.5, 3, 13);

const setEl = (patch, reflow) => {

function pickFile(accept, cb) {
  const i = el('input'); i.type = 'file'; i.accept = accept || 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast('الصورة كبيرة جداً (أكثر من ٨ ميجابايت)', true); return; }
    const r = new FileReader();
    r.onload = () => cb(r.result, f);
    r.readAsDataURL(f);
  };
  i.click();
}

/* ── step navigation ──────────────────────────────────────────────── */
let STEP = 0;
function goStep(n) {
  STEP = n;
  $$('.step').forEach((b, i) => { b.classList.toggle('on', i === n); b.classList.toggle('done', i < n); });
  $$('#left .tabpane').forEach((p, i) => p.classList.toggle('on', i === n));
  if (window.innerWidth <= 940) openMob('left');
}
function openMob(which) {
  $$('#mobtabs button').forEach(b => b.classList.toggle('on', b.dataset.mob === which));
  $('#left').classList.toggle('open', which === 'left');
  $('#right').classList.toggle('open', which === 'right');
}

/* ── left pane delegated events ───────────────────────────────────── */
$('#left').addEventListener('click', ev => {
  const T = ev.target, c = s => T.closest(s);
  let n;
  if ((n = c('.step'))) return goStep(+n.dataset.step);
  if ((n = c('.tplcard'))) return applyTemplate(n.dataset.tpl);
  if ((n = c('.sizecard'))) {
    const S = SIZES[n.dataset.size];
    DOC.size = n.dataset.size; DOC.W = S.W; DOC.H = S.H;
    applyLayout(DOC.layout, true); syncAllPanels(); fitStage(); snap(); return;
  }
  if ((n = c('.bgcard'))) {
    DOC.bg = n.dataset.bg;
    try { const o = JSON.parse(n.dataset.opts); if (o) DOC.bgOpts = o; } catch (e) {}
    if (!(LAYOUT_FIT[DOC.bg] || []).includes(DOC.layout)) DOC.layout = (LAYOUT_FIT[DOC.bg] || ['classic'])[0];
    applyLayout(DOC.layout, true); syncAllPanels(); snap(); return;
  }
  if ((n = c('.palcard'))) { DOC.palette = n.dataset.pal; render(); syncAllPanels(); snap(); return; }
  if ((n = c('.laycard'))) return applyLayout(n.dataset.lay);
  if ((n = c('.paircard'))) {
    const P = PAIRS[n.dataset.pair];
    DOC.fonts = { head: P.head, body: P.body, pair: n.dataset.pair };
    flow(); syncAllPanels(); snap(); return;
  }
  if ((n = c('.orncard'))) {
    DOC.elements.forEach(e => { if (e.type === 'divider') { e.orn = n.dataset.orn; e.ornUser = true; } });
    render(); buildStep4(); snap(); return;
  }
  if (T.id === 'bShuffle' || T.id === 'bShuffleAgain') return shuffle6();
  if (T.id === 'bReflow' || T.id === 'bReflow2') { flow(); snap(); toast('أُعيد الترتيب'); return; }
  if (T.id === 'bBgImg') return pickFile('image/*', d => { DOC.bgImage = d; if (DOC.bg !== 'upload' && DOC.bg !== 'duotone-photo') DOC.bg = 'upload'; render(); syncAllPanels(); snap(); });
  if (T.id === 'bBgImgX') { DOC.bgImage = null; render(); syncAllPanels(); snap(); return; }
  if ((n = c('[data-seg] button'))) {
    const seg = n.closest('[data-seg]'), key = seg.dataset.seg;
