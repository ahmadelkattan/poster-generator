    <hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
    <div class="grid g2">
      <button class="btn" id="eSave">${t('saveDraft')}</button>
      <button class="btn" id="eOpen">${t('openDraft')}</button>
    </div>
    <p class="hint">المسودة ملف صغير يمكن إرساله لعضو آخر في اللجنة ليكمل عليه.</p>
  </div><div class="mf"><button class="btn" onclick="closeModal()">${t('close')}</button></div>`);
}
let EXQ = 2;
$('#modal').addEventListener('click', ev => {
  const T = ev.target, n = T.closest('[data-seg] button');
  if (n && n.closest('[data-seg]').dataset.seg === 'exq') {
    EXQ = +n.dataset.v; $$('button', n.closest('[data-seg]')).forEach(b => b.classList.toggle('on', b === n)); return;
  }
  if (T.id === 'ePng') { closeModal(); exportImage('png', EXQ); }
  if (T.id === 'eJpg') { closeModal(); exportImage('jpg', EXQ); }
  if (T.id === 'ePdf') { closeModal(); setTimeout(() => print(), 120); }
  if (T.id === 'eSave') saveDraftFile();
  if (T.id === 'eOpen') openDraftFile();
});
function saveDraftFile() {
  const blob = new Blob([JSON.stringify(DOC, null, 1)], { type: 'application/json' });
  download(URL.createObjectURL(blob), posterName('json'));
  toast('نُزّلت المسودة');
}
function openDraftFile() {
  const i = el('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d || !d.elements) throw 0;
        snap(); DOC = newDoc(d); afterDocSwap(); closeModal(); toast('فُتحت المسودة');
      } catch (e) { toast('الملف غير صالح', true); }
    };
    r.readAsText(f);
  };
  i.click();
}
/* "new poster, same design" — most of their posters are a monthly series */
function newInSeries() {
  snap();
  DOC.elements.forEach(e => {
    if (e.type === 'text' && e.role !== 'kicker' && e.role !== 'footer' && e.role !== 'closing') e.html = '';
    if (e.type === 'meta') (e.rows || []).forEach(r => { if (r.icon !== 'mosque') r.text = ''; });
  });
  DOC.dateISO = '';
  flow(); syncAllPanels(); snap(); toast(t('seriesDone'));
}
function helpModal() {
  openModal(`<h3>${t('helpT')}</h3><div class="mb" style="line-height:1.95;font-size:12.5px;color:var(--txt2)">
    <p style="margin-top:0"><b style="color:var(--txt)">١ · اختر القالب</b> — نوع الإعلان يملأ كل شيء دفعة واحدة.</p>
    <p><b style="color:var(--txt)">٢ · الخلفية واللون</b> — اضغط «اقترح ٦ خيارات» بدل ضبط المؤشرات.</p>
    <p><b style="color:var(--txt)">٣ · التخطيط</b> — تغييره لا يفقدك ما كتبته.</p>
    <p><b style="color:var(--txt)">٤ · المحتوى</b> — اختر التاريخ من التقويم وسيُكتب عربياً بالكامل.</p>
    <p><b style="color:var(--txt)">٥ · التنسيق</b> — الخطوط والزخارف.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:13px 0">
    <p><b style="color:var(--txt)">على البوستر مباشرة:</b><br>
    ضغطة = تحديد · ضغطتان = الكتابة داخل العنصر<br>
    مقابض الجانب تضيّق الصندوق (فيلتف النص) · مقابض الأركان تكبّر الخط<br>
    حدّد جزءاً من النص أثناء الكتابة لتظهر أدوات التكبير والتلوين</p>
    <p><b style="color:var(--txt)">اختصارات:</b> <kbd>Ctrl/⌘ Z</kbd> تراجع · <kbd>⌘ D</kbd> تكرار · <kbd>Del</kbd> حذف · <kbd>Esc</kbd> خروج · الأسهم تحريك (<kbd>Shift</kbd> أسرع)</p>
    <p style="color:var(--txt3)">كل شيء يُحفظ تلقائياً في هذا المتصفح. للمشاركة استخدم «تنزيل المسودة».</p>
  </div><div class="mf"><button class="btn pri" onclick="closeModal()">${t('ok')}</button></div>`);
}

/* ── topbar ───────────────────────────────────────────────────────── */
$('#bUndo').onclick = undo;
$('#bRedo').onclick = redo;
$('#bExport').onclick = exportModal;
$('#bDraft').onclick = exportModal;
$('#bHelp').onclick = helpModal;
$('#bSeries').onclick = newInSeries;
$('#bLang').onclick = () => {
  LANG = LANG === 'ar' ? 'en' : 'ar';
  $('#bLang').textContent = LANG === 'ar' ? 'EN' : 'ع';
  $$('[data-i18n]').forEach(n => n.textContent = t(n.dataset.i18n));
  syncAllPanels();
};
$('#zIn').onclick = () => setZoom(ZOOM * 1.2);
$('#zOut').onclick = () => setZoom(ZOOM / 1.2);
$('#zFit').onclick = () => { ZFIT = true; $('#zFit').classList.add('on'); fitStage(); };
$('#zSafe').onclick = () => { SHOWSAFE = !SHOWSAFE; $('#safeguide').style.display = SHOWSAFE ? 'block' : 'none'; $('#zSafe').classList.toggle('on', SHOWSAFE); };
$('#mobtabs').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) openMob(b.dataset.mob); });
addEventListener('resize', debounce(() => fitStage(), 120));

/* ── boot ─────────────────────────────────────────────────────────── */
/* URL presets — used by proof.html for the side-by-side acceptance sheet.
   e.g. index.html?demo=lecture&bg=inverted&pal=bone&chrome=0                */
function applyDemo(P) {
  applyTemplate(P.get('demo') || 'lecture');
  const set = (k, fn) => { const v = P.get(k); if (v) fn(v); };
  set('pal', v => { if (PAL[v]) DOC.palette = v; });
  set('bg', v => { if (BG[v]) DOC.bg = v; });
  set('inv', v => DOC.bgOpts.inverted = v === '1');
  set('font', v => { const p = PAIRS[v]; if (p) DOC.fonts = { head: p.head, body: p.body, pair: v }; });
  set('lay', v => { if (LAYOUTS[v]) DOC.layout = v; });
  applyLayout(DOC.layout, true);
}

function boot() {
  loadPhrases();
  const P = new URLSearchParams(location.search);
  const demo = P.has('demo');
  if (P.get('chrome') === '0') document.body.classList.add('bare');
  const saved = demo ? null : loadLocal();
  DOC = newDoc(saved || {});
  if (demo) applyDemo(P);
  else if (!saved) applyTemplate('lecture');
  else applyLayout(DOC.layout, true);
  syncAllPanels();
  render(); fitStage();
  $('#zFit').classList.add('on');
  HIST.past.length = 0; HIST.future.length = 0; updateHistBtns();
  if (!demo && !localStorage.getItem('mirsam.seen')) {
    try { localStorage.setItem('mirsam.seen', '1'); } catch (e) {}
    setTimeout(helpModal, 700);
  }
  if (document.fonts) document.fonts.ready.then(() => { flow(); fitStage(); });
}
boot();

</script>
</body>
