<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مرسام — استوديو بوسترات لجنة المساجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700;900&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;600;700&family=Aref+Ruqaa:wght@400;700&family=El+Messiri:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;700;900&family=Changa:wght@400;600;700&family=Marhey:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14181a;
  --bg2:#1b2124;
  --panel:#1f272a;
  --panel2:#263135;
  --line:#33403f;
  --line2:#3f4f4d;
  --txt:#e8e6df;
  --txt2:#9aa8a6;
  --txt3:#6f7d7c;
  --brass:#c8a44a;
  --brass2:#e0bf6a;
  --green:#2f9b6e;
  --danger:#d9705c;
  --r:9px;
  --ui:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--txt);
  font-family:var(--ui);
  font-size:14px;
  overflow:hidden;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#33403f;border-radius:20px}
::-webkit-scrollbar-track{background:transparent}

/* ── shell ─────────────────────────────────────────── */
#app{display:flex;flex-direction:column;height:100%}
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:54px;flex:0 0 54px;
  background:linear-gradient(180deg,#1e2528,#171d1f);
  border-bottom:1px solid var(--line);
  z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.2px}
.brand .mark{
  width:26px;height:26px;border-radius:7px;flex:0 0 26px;
  background:conic-gradient(from 220deg,var(--brass),#0b5d3b 40%,#123a63 70%,var(--brass));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
}
.brand small{display:block;font-weight:500;font-size:10.5px;color:var(--txt3);margin-top:-3px}
.spacer{flex:1}

.btn{
  display:inline-flex;align-items:center;gap:6px;justify-content:center;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;
  transition:background .12s,border-color .12s,transform .08s;white-space:nowrap;
}
.btn:hover{background:#2e3b3f}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(180deg,#d3ae51,#b8912f);border-color:#8d6d1c;color:#20180a;font-weight:800}
.btn.pri:hover{background:linear-gradient(180deg,#e0bd63,#c69d38)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--txt2)}
.btn.ghost:hover{background:var(--panel2);color:var(--txt)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.icon{padding:6px;width:32px;height:32px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── body columns ──────────────────────────────────── */
#main{flex:1;display:flex;min-height:0}
.pane{
  width:310px;flex:0 0 310px;background:var(--panel);
  border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#right{border-inline-end:none;border-inline-start:1px solid var(--line);width:300px;flex-basis:300px}
.pane-head{
  display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line);flex:0 0 auto;
  background:var(--bg2);
}
.tab{
  flex:1;text-align:center;padding:7px 4px;border-radius:7px;cursor:pointer;
  font-size:12.5px;font-weight:700;color:var(--txt3);border:1px solid transparent;
}
.tab.on{background:var(--panel2);color:var(--txt);border-color:var(--line2)}
.pane-body{flex:1;overflow-y:auto;padding:14px;min-height:0}
.tabpane{display:none}
.tabpane.on{display:block}

.sec{margin-bottom:20px}
.sec:last-child{margin-bottom:6px}
.sec-t{
  font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--txt3);
  text-transform:uppercase;margin:0 0 9px;display:flex;align-items:center;gap:7px;
}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}

label.f{display:block;margin-bottom:11px}
label.f > span{display:block;font-size:12px;color:var(--txt2);margin-bottom:5px;font-weight:600}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;
  padding:8px 10px;outline:none;transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--brass);box-shadow:0 0 0 3px rgba(200,164,74,.15)}
textarea{resize:vertical;min-height:74px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt3) 50%),linear-gradient(135deg,var(--txt3) 50%,transparent 50%);background-position:left 12px top 17px,left 7px top 17px;background-size:5px 5px;background-repeat:no-repeat}
input[type=color]{width:100%;height:34px;padding:2px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--brass);background:transparent}
.row{display:flex;gap:8px}
.row > *{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:12px;cursor:pointer;color:var(--txt2);
}
.chip:hover{border-color:var(--brass);color:var(--txt)}

.grid{display:grid;gap:9px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{
  border:1.5px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;
  background:var(--bg2);transition:border-color .12s,transform .1s;position:relative;
}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.on{border-color:var(--brass);box-shadow:0 0 0 3px rgba(200,164,74,.18)}
.card svg{display:block;width:100%;height:auto}
.card .cap{
  font-size:10.5px;padding:5px 6px;text-align:center;color:var(--txt2);
  border-top:1px solid var(--line);background:var(--panel);font-weight:600;
}
.card.on .cap{color:var(--brass2)}

.pal{display:flex;height:26px;border-radius:6px;overflow:hidden}
.pal i{flex:1}
.pal i.w{flex:1.6}

.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{
  flex:1;background:transparent;border:0;padding:6px 4px;border-radius:6px;cursor:pointer;
  color:var(--txt3);font-weight:700;font-size:12px;
}
.seg button.on{background:var(--panel2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2)}
.seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;cursor:pointer}
.switch span{font-size:12.5px;color:var(--txt2);font-weight:600}
.switch input{display:none}
.track{width:38px;height:21px;border-radius:20px;background:var(--line);position:relative;transition:background .15s;flex:0 0 38px}
.track::after{content:"";position:absolute;top:2.5px;inset-inline-end:2.5px;width:16px;height:16px;border-radius:50%;background:var(--txt2);transition:.15s}
.switch input:checked + .track{background:rgba(200,164,74,.45)}
.switch input:checked + .track::after{inset-inline-end:19.5px;background:var(--brass2)}

.hint{font-size:11.5px;color:var(--txt3);line-height:1.65;margin:6px 0 0}
.empty{color:var(--txt3);font-size:12.5px;text-align:center;padding:34px 14px;line-height:1.8}

/* ── stage ─────────────────────────────────────────── */
#stagewrap{
  flex:1;min-width:0;position:relative;overflow:auto;
  background:
    radial-gradient(1100px 700px at 50% 0%,#1e2629 0%,#14181a 70%),
    repeating-linear-gradient(45deg,rgba(255,255,255,.011) 0 2px,transparent 2px 6px);
  display:flex;align-items:flex-start;justify-content:center;padding:26px 20px 90px;
}
#scaler{position:relative;transform-origin:top center;flex:0 0 auto}
#stage{
  position:relative;overflow:hidden;background:#fff;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07);
}
#bglayer{position:absolute;inset:0;pointer-events:none}
#bglayer svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#ellayer{position:absolute;inset:0}

.el{position:absolute;box-sizing:border-box;cursor:default}
.el.selectable{cursor:move}
.el.text{white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word}
.el.text[contenteditable=true]{cursor:text;outline:none}
.el .metarow{display:flex;align-items:center;gap:.55em}
.el .metarow .mi{flex:0 0 auto;display:flex;align-items:center}
.el .metarow .mi svg{width:1.28em;height:1.28em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.el .metarow .mt{flex:1;min-width:0}
.el .metasep{height:1px;background:currentColor;opacity:.28}
.el .vline{width:1px;align-self:stretch;background:currentColor;opacity:.3;margin:0 .1em}
.el img{width:100%;height:100%;display:block;object-fit:cover}

#overlay{position:absolute;inset:0;pointer-events:none;z-index:20}
#sel{position:absolute;border:1.5px solid var(--brass);display:none;pointer-events:none}
#sel .h{
  position:absolute;width:13px;height:13px;background:#fff;border:1.5px solid var(--brass);
  border-radius:3px;pointer-events:auto;
}
#sel .h.e{inset-inline-start:-7px;top:50%;margin-top:-6.5px;cursor:ew-resize}
#sel .h.w{inset-inline-end:-7px;top:50%;margin-top:-6.5px;cursor:ew-resize}
#sel .h.n{top:-7px;left:50%;margin-left:-6.5px;cursor:ns-resize}
#sel .h.s{bottom:-7px;left:50%;margin-left:-6.5px;cursor:ns-resize}
#sel .h.ne{top:-7px;right:-7px;cursor:nesw-resize}
#sel .h.nw{top:-7px;left:-7px;cursor:nwse-resize}
#sel .h.se{bottom:-7px;right:-7px;cursor:nwse-resize}
#sel .h.sw{bottom:-7px;left:-7px;cursor:nesw-resize}
#sel.editing{border-style:dashed;border-color:var(--green)}
#sel.editing .h{display:none}
#sel .tag{
  position:absolute;top:-25px;inset-inline-start:0;background:var(--brass);color:#20180a;
  font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap;
}
.guide{position:absolute;background:#37c39a;pointer-events:none}
.guide.v{width:1px;top:0;bottom:0}
.guide.h{height:1px;left:0;right:0}

#hoverbox{position:absolute;border:1px dashed rgba(200,164,74,.6);display:none;pointer-events:none}

#floatbar{
  position:fixed;z-index:60;display:none;gap:3px;background:#0f1416;
  border:1px solid var(--line2);border-radius:9px;padding:4px;
  box-shadow:0 12px 30px rgba(0,0,0,.6);
}
#floatbar button{
  background:transparent;border:0;color:var(--txt2);cursor:pointer;border-radius:6px;
  padding:5px 8px;font-weight:800;font-size:12.5px;min-width:30px;
}
#floatbar button:hover{background:var(--panel2);color:var(--txt)}
#floatbar .divv{width:1px;background:var(--line);margin:3px 1px}

#zoombar{
  position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;background:rgba(15,20,22,.92);
  border:1px solid var(--line2);border-radius:22px;padding:4px 6px;z-index:30;
  backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#zoombar button{background:transparent;border:0;color:var(--txt2);cursor:pointer;padding:5px 9px;border-radius:16px;font-weight:700}
#zoombar button:hover{background:var(--panel2);color:var(--txt)}
#zoomval{font-size:12px;color:var(--txt2);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* ── modal / toast ─────────────────────────────────── */
#scrim{position:fixed;inset:0;background:rgba(8,11,12,.72);display:none;z-index:80;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
#scrim.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal h3{margin:0;padding:16px 18px;border-bottom:1px solid var(--line);font-size:15px}
.modal .mb{padding:18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toast{
  position:fixed;bottom:22px;inset-inline-start:22px;background:#0f1416;color:var(--txt);
  border:1px solid var(--line2);border-inline-start:3px solid var(--brass);
  padding:11px 15px;border-radius:10px;z-index:90;opacity:0;transform:translateY(10px);
  transition:.22s;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.5);max-width:340px;
}
#toast.on{opacity:1;transform:none}

.layerlist{display:flex;flex-direction:column;gap:4px}
.layeritem{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;
  background:var(--bg2);border:1px solid transparent;font-size:12.5px;
}
.layeritem:hover{border-color:var(--line2)}
.layeritem.on{border-color:var(--brass);background:var(--panel2)}
.layeritem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt2)}
.layeritem.on .nm{color:var(--txt)}
.layeritem button{background:transparent;border:0;color:var(--txt3);cursor:pointer;padding:2px}
.layeritem button:hover{color:var(--danger)}
.layeritem svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

kbd{background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:11px;font-family:var(--ui)}

/* ── responsive ────────────────────────────────────── */
#mobtabs{display:none}
@media (max-width:940px){
  #main{flex-direction:column}
  .pane{
    width:100%;flex:0 0 auto;max-height:44vh;border:0;border-top:1px solid var(--line);
    position:absolute;bottom:44px;left:0;right:0;z-index:50;display:none;
  }
  .pane.open{display:flex}
  #right{border:0;border-top:1px solid var(--line);width:100%}
  #stagewrap{padding:14px 12px 120px}
  #mobtabs{
    display:flex;position:absolute;bottom:0;left:0;right:0;height:44px;z-index:55;
    background:var(--bg2);border-top:1px solid var(--line);
  }
  #mobtabs button{flex:1;background:transparent;border:0;color:var(--txt3);font-weight:700;font-size:12.5px;cursor:pointer}
  #mobtabs button.on{color:var(--brass2);box-shadow:inset 0 2px 0 var(--brass)}
  #zoombar{bottom:56px}
  #app{position:relative}
}
@media print{
  body{background:#fff;overflow:visible}
  #topbar,.pane,#zoombar,#overlay,#mobtabs,#floatbar{display:none !important}
  #stagewrap{padding:0;background:#fff;overflow:visible;display:block}
  #scaler{transform:none !important}
  #stage{box-shadow:none}
  @page{margin:0}
}
</style>
</head>
<body>
</body>
</html>
